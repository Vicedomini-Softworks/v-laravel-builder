name: image

# Public repository: GitHub-hosted runners are free here, and no pull_request
# trigger means untrusted code from a fork never gets the package-write token.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/image.yml'
  schedule:
    # Weekly rebuild to pick up base-image and security updates.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vicedomini-softworks/v-laravel-builder
  PHP_VERSION: '8.5'
  NODE_MAJOR: '22'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `8.5` is the tag the Jenkinsfiles pin; `latest` follows it; `sha-…` makes a
      # given build reproducible.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}
            type=raw,value=latest
            type=sha,prefix=sha-

      # Build into the local daemon first so a broken image is caught before it is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: v-laravel-builder:ci
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NODE_MAJOR=${{ env.NODE_MAJOR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --rm v-laravel-builder:ci sh -c '
            set -e
            php -v | head -1
            composer --version
            node --version
            git --version
            pdftotext -v
            [ "$(php -r "echo ini_get(\"memory_limit\");")" = "-1" ] || { echo "memory_limit is not unlimited"; exit 1; }
            for ext in bcmath ctype curl dom exif fileinfo gd intl mbstring openssl pcntl pdo_mysql pdo_pgsql pdo_sqlite redis sockets sodium tokenizer xml xsl zip; do
              php -m | grep -qix "$ext" || { echo "missing PHP extension: $ext"; exit 1; }
            done
          '

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            NODE_MAJOR=${{ env.NODE_MAJOR }}
          cache-from: type=gha
